<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>淘寶比價本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --surface:#FFFFFF; --ink:#1C2541; --muted:#6B7489; --line:#DDE1E8;
  --price:#D7263D; --good:#13795B; --target:#2F5BD3; --sticker:#FFD93D; --sticker-ink:#1C2541; --soft:#EEF1F6;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121722; --surface:#1A2030; --ink:#E8ECF4; --muted:#9AA3B5; --line:#2A3245;
    --price:#FF5A6E; --good:#3CC48F; --target:#7FA2FF; --sticker:#F2C94C; --sticker-ink:#1C2541; --soft:#222A3C;
  }
}
:root[data-theme="dark"]{
  --paper:#121722; --surface:#1A2030; --ink:#E8ECF4; --muted:#9AA3B5; --line:#2A3245;
  --price:#FF5A6E; --good:#3CC48F; --target:#7FA2FF; --sticker:#F2C94C; --sticker-ink:#1C2541; --soft:#222A3C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--price);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:1.9rem;line-height:1.2;margin:0 0 4px;letter-spacing:.02em}
header p{margin:0;color:var(--muted)}
.searchbar{display:flex;gap:10px;margin:24px 0 20px;flex-wrap:wrap}
.searchbar input{flex:1 1 260px;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--price);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px;border:1.5px solid transparent;border-radius:10px;background:transparent;cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.item .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .p{font-family:var(--num);font-weight:700;font-size:1.25rem;color:var(--price);line-height:1.2}
.item .t{grid-column:1/3;font-size:.82rem;color:var(--muted)}
.item .t.low{color:var(--good)}
.item .t.hit{color:var(--target);font-weight:700}
.item.hit{border-left:4px solid var(--target)}
.target{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border:1.5px dashed var(--target);border-radius:10px}
.target input{width:120px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.target .msg{color:var(--target);font-weight:500}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.9rem}
.sticker.hit{background:var(--target);color:#fff}
.empty-list{color:var(--muted);padding:12px 4px;font-size:.92rem}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px;min-width:0}
.panel h2{margin:0;font-size:1.3rem;line-height:1.35}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:.9rem}
.links a{color:var(--muted)}
.hero{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:22px 0 18px}
.now small{display:block;color:var(--muted);font-size:.9rem}
.now .big{font-family:var(--num);font-weight:700;font-size:clamp(3.4rem,9vw,5.2rem);line-height:.9;color:var(--price)}
.now .big span{font-size:.5em;margin-right:2px}
.sticker{background:var(--sticker);color:var(--sticker-ink);padding:10px 16px 8px;border-radius:6px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink);margin-bottom:6px}
.sticker b{display:block;font-size:1.15rem;line-height:1.3}
.sticker span{font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{padding:12px 8px}
.stats small{display:block;color:var(--muted);font-size:.82rem}
.stats strong{font-family:var(--num);font-size:1.6rem;font-weight:700;line-height:1.1}
.stats .lowv{color:var(--good)}
.chart{margin:20px 0 6px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{font-family:var(--num);fill:var(--muted);font-size:13px}
section.sub{margin-top:24px}
section.sub h3{font-size:1rem;margin:0 0 10px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.addrow input[type=date]{flex:0 1 170px}
.addrow input[type=number]{flex:1 1 120px}
.table-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.pr{font-family:var(--num);font-size:1.15rem;font-weight:700;text-align:right}
td.ch{text-align:right;color:var(--muted);font-size:.85rem}
td.x{text-align:right;width:40px}
.x button{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px}
.x button:hover{color:var(--price);background:var(--soft)}
.advice{margin-top:12px;padding:14px 16px;background:var(--soft);border-radius:10px;white-space:pre-wrap;font-size:.95rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.welcome{padding:10px 4px}
.welcome h2{font-size:1.3rem;margin:0 0 8px}
.welcome ol{padding-left:1.3em;color:var(--muted);margin:0 0 18px}
dialog{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:24px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,24,.45)}
dialog h2{margin:0 0 14px;font-size:1.25rem}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
dialog input,dialog textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
dialog textarea{min-height:110px;resize:vertical;font-family:var(--num);font-size:1.05rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.err{color:var(--price);font-size:.88rem;min-height:1.3em;margin-top:8px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.note{margin-top:28px;font-size:.85rem;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:no-preference){.sticker{animation:pop .35s ease-out}}
@keyframes pop{from{transform:rotate(-12deg) scale(.6);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>淘寶比價本</h1>
    <p>記下每次看到的價格，下次打開就知道現價算不算便宜。</p>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="搜尋已記錄的商品，或貼上淘寶／天貓連結" aria-label="搜尋商品">
    <button class="btn" id="addBtn">新增商品</button>
  </div>

  <div class="layout">
    <nav class="list" id="list" aria-label="已記錄的商品"></nav>
    <main class="panel" id="panel"></main>
  </div>

  <p class="note">價格由你記錄：淘寶不開放外部網站直接讀取商品價格，所以每次逛到商品時，把看到的價格記下來（或從其他比價工具複製歷史價格貼進來），這裡會幫你整理成走勢、比較現價，並在達到目標價時標示出來。</p>
</div>

<dialog id="dlg">
  <h2>新增商品</h2>
  <label for="fName">商品名稱</label>
  <input id="fName" placeholder="例如：小米空氣清淨機 4 Pro">
  <label for="fUrl">商品連結（選填）</label>
  <input id="fUrl" placeholder="https://item.taobao.com/...">
  <label for="fPrice">現在看到的價格（¥）</label>
  <input id="fPrice" type="number" step="0.01" min="0" inputmode="decimal">
  <label for="fTarget">目標價（選填，低於這個價格就提醒你）</label>
  <input id="fTarget" type="number" step="0.01" min="0" inputmode="decimal">
  <label for="fHist">歷史價格（選填，每行一筆：日期 價格）</label>
  <textarea id="fHist" placeholder="2026-06-18 699&#10;2026-08-01 799&#10;2026-09-10 749"></textarea>
  <div class="hint">可直接貼上從比價工具複製的資料，日期格式 2026-06-18 或 2026/6/18 都可以。</div>
  <div class="err" id="fErr"></div>
  <div class="foot">
    <button class="btn ghost" id="cancelBtn">取消</button>
    <button class="btn" id="saveBtn">儲存商品</button>
  </div>
</dialog>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const LS = 'tb-price-book-v1';
  const state = { items: [], sel: null, q: '', mode: 'local', db: null, col: null, sample: null, advice: {} };

  const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const fmt = n => (Math.round(n*100)/100).toLocaleString('zh-Hant',{maximumFractionDigits:2});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';

  function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; } }
  function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state.items)); } catch(e){} }

  async function persist(item){
    if (state.mode === 'db') { try { await state.db.collection(state.col).doc(item.id).set(item); } catch(e){ console.warn(e); } }
    else saveLocal();
  }
  async function removeDoc(id){
    if (state.mode === 'db') { try { await state.db.collection(state.col).doc(id).delete(); } catch(e){ console.warn(e); } }
    else saveLocal();
  }

  function sorted(points){ return [...points].sort((a,b)=> a.d < b.d ? -1 : a.d > b.d ? 1 : (a.t||0)-(b.t||0)); }
  function analyze(item){
    const pts = sorted(item.points || []);
    if (!pts.length) return null;
    const prices = pts.map(p=>p.p);
    const cur = pts[pts.length-1].p;
    const min = Math.min(...prices), max = Math.max(...prices);
    const avg = prices.reduce((a,b)=>a+b,0)/prices.length;
    const minPt = pts.find(p=>p.p===min);
    const target = item.target>0 ? item.target : null;
    let verdict;
    if (target && cur <= target) verdict = {k:'hit', title:'已達目標價', sub:'低於你設定的 ¥'+fmt(target)+'，可以下手'};
    else if (pts.length === 1) verdict = {k:'new', title:'第一筆紀錄', sub:'多記幾次才看得出價格高低'};
    else if (cur <= min) verdict = {k:'low', title:'歷史最低價', sub:'目前是有紀錄以來最便宜'};
    else if ((cur-min)/min <= 0.05) verdict = {k:'low', title:'接近最低價', sub:'只比最低貴 ¥'+fmt(cur-min)};
    else if (cur > avg) verdict = {k:'high', title:'比平均貴', sub:'比最低貴 ¥'+fmt(cur-min)+'，可以再等等'};
    else verdict = {k:'mid', title:'一般價位', sub:'比最低貴 ¥'+fmt(cur-min)};
    return { pts, cur, min, max, avg, minPt, verdict, target };
  }

  function chartSVG(a){
    const W=640,H=230,L=48,R=16,T=18,B=34;
    const pts=a.pts;
    const ts=pts.map(p=>new Date(p.d+'T00:00:00').getTime());
    let t0=Math.min(...ts), t1=Math.max(...ts); if (t0===t1){ t0-=864e5*3; t1+=864e5*3; }
    let lo=a.target?Math.min(a.min,a.target):a.min, hi=a.target?Math.max(a.max,a.target):a.max; const pad=(hi-lo)*0.15 || hi*0.1 || 1; lo=Math.max(0,lo-pad); hi=hi+pad;
    const x=t=>L+(t-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
    const line=pts.map((p,i)=>`${x(ts[i]).toFixed(1)},${y(p.p).toFixed(1)}`).join(' ');
    let g='';
    for (let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
    const fd=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate();};
    g+=`<text x="${L}" y="${H-10}">${fd(t0)}</text><text x="${W-R}" y="${H-10}" text-anchor="end">${fd(t1)}</text>`;
    const ym=y(a.min);
    g+=`<line x1="${L}" x2="${W-R}" y1="${ym}" y2="${ym}" stroke="var(--good)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-R}" y="${ym-6}" text-anchor="end" style="fill:var(--good)">最低 ¥${fmt(a.min)}</text>`;
    if (a.target){ const yt=y(a.target); g+=`<line x1="${L}" x2="${W-R}" y1="${yt}" y2="${yt}" stroke="var(--target)" stroke-width="1.5"/><text x="${L+4}" y="${yt-6}" style="fill:var(--target)">目標 ¥${fmt(a.target)}</text>`; }
    g+=`<polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ const last=i===pts.length-1; g+=`<circle cx="${x(ts[i])}" cy="${y(p.p)}" r="${last?6:3.5}" fill="${last?'var(--price)':'var(--surface)'}" stroke="${last?'var(--price)':'var(--ink)'}" stroke-width="2"><title>${p.d}  ¥${fmt(p.p)}</title></circle>`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="價格走勢圖">${g}</svg>`;
  }

  function renderList(){
    const el=$('#list'); const q=state.q.trim().toLowerCase();
    const items=[...state.items].sort((a,b)=>(b.updated||0)-(a.updated||0))
      .filter(it=>!q || (it.name||'').toLowerCase().includes(q) || (it.url||'').toLowerCase().includes(q));
    if (!state.items.length){ el.innerHTML='<div class="empty-list">還沒有記錄任何商品。</div>'; return; }
    if (!items.length){ el.innerHTML='<div class="empty-list">找不到「'+esc(state.q)+'」。按「新增商品」把它記下來。</div>'; return; }
    el.innerHTML=items.map(it=>{ const a=analyze(it);
      const hit=a&&a.verdict.k==='hit';
      const tag=a? (hit? '<span class="t hit">已達目標價 ¥'+fmt(a.target)+'</span>' : a.verdict.k==='low'? '<span class="t low">'+a.verdict.title+'</span>' : '<span class="t">最低 ¥'+fmt(a.min)+'・'+a.pts.length+' 筆紀錄</span>') : '<span class="t">尚無價格</span>';
      return `<button class="item${hit?' hit':''}" data-id="${it.id}" aria-current="${it.id===state.sel}"><span class="n">${esc(it.name)}</span><span class="p">${a?'¥'+fmt(a.cur):''}</span>${tag}</button>`; }).join('');
  }

  function renderPanel(){
    const el=$('#panel'); const it=state.items.find(i=>i.id===state.sel);
    if (!it){
      el.innerHTML=`<div class="welcome"><h2>現在的價格，真的是特價嗎？</h2>
        <ol><li>逛淘寶時看到想買的東西，把名稱和價格記下來。</li><li>之後每次再看到，就加一筆新價格。</li><li>這裡會比較現價和歷史最低、最高、平均，告訴你該買還是該等。</li></ol>
        <button class="btn" id="startBtn">新增第一個商品</button> <button class="btn ghost" id="demoBtn">看範例</button></div>`;
      $('#startBtn').onclick=()=>openDialog();
      $('#demoBtn').onclick=addDemo;
      return;
    }
    const a=analyze(it); const url=safeUrl(it.url);
    const tbSearch='https://s.taobao.com/search?q='+encodeURIComponent(it.name);
    let html=`<h2>${esc(it.name)}</h2><div class="links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">打開商品頁</a>`:''}<a href="${tbSearch}" target="_blank" rel="noopener">在淘寶搜尋同款現價</a><a href="https://www.manmanbuy.com/" target="_blank" rel="noopener">到慢慢買查歷史價</a>${url?'<button class="linkbtn" id="copyUrl">複製商品連結</button>':''}</div>`;
    if (a){
      const diff=a.cur-a.min, pct=a.min? diff/a.min*100:0;
      html+=`<div class="hero"><div class="now"><small>現價（${a.pts[a.pts.length-1].d}）</small><div class="big"><span>¥</span>${fmt(a.cur)}</div></div>
        <div class="sticker${a.verdict.k==='hit'?' hit':''}" role="status"><b>${a.verdict.title}</b><span>${esc(a.verdict.sub)}</span></div></div>
        <div class="stats">
          <div><small>歷史最低</small><strong class="lowv">¥${fmt(a.min)}</strong><small>${a.minPt.d}</small></div>
          <div><small>歷史最高</small><strong>¥${fmt(a.max)}</strong></div>
          <div><small>平均價</small><strong>¥${fmt(a.avg)}</strong></div>
          <div><small>現價比最低</small><strong>${diff>0?'+':''}${fmt(pct)}%</strong></div>
        </div>
        ${a.pts.length>1?`<div class="chart">${chartSVG(a)}</div>`:''}`;
    }
    const tmsg = !it.target ? '設定後，價格低於目標時清單會標示出來。' : (a && a.cur<=it.target ? '現價已低於目標價。' : (a ? '距離目標還差 ¥'+fmt(a.cur-it.target) : ''));
    html+=`<div class="target"><label for="tInput" style="margin:0;color:var(--ink)">目標價 ¥</label><input id="tInput" type="number" step="0.01" min="0" inputmode="decimal" value="${it.target||''}"><button class="btn ghost" id="tSave">儲存目標價</button><span class="msg">${esc(tmsg)}</span></div>`;
    html+=`<section class="sub"><h3>記錄新價格</h3><div class="addrow">
        <input type="date" id="pDate" value="${today()}" aria-label="日期">
        <input type="number" id="pPrice" step="0.01" min="0" inputmode="decimal" placeholder="價格 ¥" aria-label="價格">
        <button class="btn" id="pAdd">記錄價格</button></div><div class="err" id="pErr"></div>`;
    if (a){
      const rows=[...a.pts].reverse();
      html+=`<div class="table-wrap"><table><tbody>${rows.map((p,i)=>{ const prev=rows[i+1]; const ch=prev? p.p-prev.p : null;
        return `<tr><td>${p.d}</td><td class="pr">¥${fmt(p.p)}</td><td class="ch">${ch===null?'':(ch>0?'漲 ¥'+fmt(ch):ch<0?'降 ¥'+fmt(-ch):'持平')}</td><td class="x"><button data-del="${p.id}" aria-label="刪除 ${p.d} 的紀錄">✕</button></td></tr>`; }).join('')}</tbody></table></div>`;
    }
    html+=`</section>`;
    const adv=state.advice[it.id];
    html+=`<div class="actions">${state.sample && a && a.pts.length>1?'<button class="btn ghost" id="askBtn">問 Claude：現在該買嗎？</button>':''}<button class="btn danger" id="delItem">刪除這個商品</button></div>
      ${adv?`<div class="advice" id="adviceBox">${esc(adv)}</div>`:''}`;
    el.innerHTML=html;

    $('#pAdd').onclick=async()=>{
      const d=$('#pDate').value, p=parseFloat($('#pPrice').value);
      if (!d || !(p>0)){ $('#pErr').textContent='請填寫日期和大於 0 的價格。'; return; }
      it.points=[...(it.points||[]),{id:uid(),d,p,t:Date.now()}]; it.updated=Date.now();
      render(); await persist(it);
    };
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      it.points=it.points.filter(p=>p.id!==b.dataset.del); it.updated=Date.now(); render(); await persist(it);
    });
    $('#delItem').onclick=async()=>{
      if (!confirm('確定刪除「'+it.name+'」和它的所有價格紀錄？')) return;
      state.items=state.items.filter(i=>i.id!==it.id); state.sel=null; render(); await removeDoc(it.id);
    };
    $('#tSave').onclick=async()=>{ const v=parseFloat($('#tInput').value); it.target = v>0 ? v : null; it.updated=Date.now(); render(); await persist(it); };
    const cp=$('#copyUrl'); if (cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(it.url); cp.textContent='已複製'; }catch(e){ const i=$('#fUrl'); prompt('複製這個連結：', it.url); } };
    const ask=$('#askBtn'); if (ask) ask.onclick=()=>askClaude(it,a,ask);
  }

  async function askClaude(it,a,btn){
    btn.disabled=true; btn.textContent='Claude 思考中…';
    const data={商品:it.name, 目標價:it.target||'未設定', 價格紀錄:a.pts.map(p=>({日期:p.d,價格:p.p})), 今天:today()};
    const prompt=`你是幫消費者判斷淘寶商品是否值得現在買的助手。根據以下使用者自己記錄的價格歷史，用繁體中文給出 3 到 5 句簡短建議：現價在歷史區間的位置、價格趨勢，以及考慮到即將到來的大促（例如雙 11、雙 12、618）是否值得等待。只根據提供的資料判斷，不要編造其他價格。\n\n${JSON.stringify(data)}`;
    state.advice[it.id]='…'; renderPanel();
    try{
      const r=await state.sample(prompt,{onText:({text})=>{ state.advice[it.id]=text; const box=$('#adviceBox'); if(box) box.textContent=text; }});
      state.advice[it.id]=r.text;
    }catch(e){
      state.advice[it.id]= e && e.code==='rate_limited' ? '請求太頻繁，請稍後再試。' : (e && e.text) || '目前無法取得建議。';
      if (e && e.code==='not_granted') state.sample=null;
    }
    renderPanel();
  }

  function render(){ renderList(); renderPanel(); }

  // dialog
  const dlg=$('#dlg');
  function openDialog(prefill={}){
    $('#fName').value=prefill.name||''; $('#fUrl').value=prefill.url||''; $('#fPrice').value=''; $('#fHist').value=''; $('#fTarget').value=''; $('#fErr').textContent='';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
    setTimeout(()=>(prefill.url?$('#fName'):$('#fName')).focus(),30);
  }
  function parseHist(txt){
    const out=[], bad=[];
    txt.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
      const m=line.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})\D+?([\d,]+(?:\.\d+)?)/);
      if (m){ out.push({id:uid(),d:`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`,p:parseFloat(m[4].replace(/,/g,'')),t:0}); }
      else bad.push(line);
    });
    return {out,bad};
  }
  $('#cancelBtn').onclick=()=>dlg.close();
  $('#saveBtn').onclick=async()=>{
    const name=$('#fName').value.trim(), url=$('#fUrl').value.trim(), price=parseFloat($('#fPrice').value);
    const {out,bad}=parseHist($('#fHist').value);
    if (!name){ $('#fErr').textContent='請填寫商品名稱。'; return; }
    if (!(price>0) && !out.length){ $('#fErr').textContent='請至少填寫現價或一筆歷史價格。'; return; }
    if (bad.length){ $('#fErr').textContent='這幾行看不懂，請改成「日期 價格」：'+bad.slice(0,2).join('、'); return; }
    const points=[...out]; if (price>0) points.push({id:uid(),d:today(),p:price,t:Date.now()});
    const tv=parseFloat($('#fTarget').value);
    const item={id:uid(),name,url,points,target: tv>0?tv:null,created:Date.now(),updated:Date.now()};
    state.items.push(item); state.sel=item.id; state.q=''; $('#q').value='';
    dlg.close(); render(); await persist(item);
  };

  async function addDemo(){
    const base=[['2026-05-20',899],['2026-06-18',699],['2026-07-15',829],['2026-08-10',799],['2026-09-05',859],[today(),789]];
    const item={id:uid(),name:'範例：空氣清淨機（可刪除）',url:'',points:base.map(([d,p],i)=>({id:uid(),d,p,t:i})),created:Date.now(),updated:Date.now()};
    state.items.push(item); state.sel=item.id; render(); await persist(item);
  }

  $('#addBtn').onclick=()=>{ const v=$('#q').value.trim(); openDialog(/^https?:\/\//i.test(v)?{url:v}:{name:v}); };
  $('#q').addEventListener('input',e=>{ state.q=e.target.value; renderList(); });
  $('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=$('#list .item'); if(first) first.click(); else $('#addBtn').click(); } });
  $('#list').addEventListener('click',e=>{ const b=e.target.closest('.item'); if(!b) return; state.sel=b.dataset.id; render(); if (window.innerWidth<820) $('#panel').scrollIntoView({behavior:'smooth',block:'start'}); });

  // boot: local first, then upgrade to per-person cloud storage when available
  state.items=loadLocal(); if (state.items[0]) state.sel=[...state.items].sort((a,b)=>(b.updated||0)-(a.updated||0))[0].id;
  render();

  if (window.claude && window.claude.use){
    (async()=>{
      try{
        const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
        if (db && user){
          const id=await user.id();
          if (id){
            state.db=db; state.col='data/users/'+id; state.mode='db';
            db.collection(state.col).onSnapshot(snap=>{
              state.items=snap.docs.filter(d=>d.exists).map(d=>d.data());
              if (state.sel && !state.items.find(i=>i.id===state.sel)) state.sel=null;
              if (!state.sel && state.items.length) state.sel=[...state.items].sort((a,b)=>(b.updated||0)-(a.updated||0))[0].id;
              render();
            }, err=>{ console.warn('db',err); });
          }
        }
      }catch(e){ console.warn(e); }
    })();
    (async()=>{ try{ const s=await claude.use('sample'); if (s){ state.sample=s; renderPanel(); } }catch(e){} })();
  }
})();
</script>
</body>
</html>
